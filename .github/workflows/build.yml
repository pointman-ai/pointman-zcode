name: Build ZCode SEA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Require reviewed immutable upstream pin
        id: pin
        shell: bash
        run: |
          commit="$(python3 scripts/source-pin.py)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install locked workspace dependencies
        working-directory: upstream
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      # These are the first two commands from @zcode/cli's build:sea script.
      # Build every CLI workspace package: SEA also embeds official plugins/TUI.
      - name: Build workspace dependencies and CLI
        working-directory: upstream
        run: |
          pnpm exec turbo --skip-infer --cwd apps/zcode-cli run build --filter=!@zcode/cli --force
          pnpm --filter @zcode/cli build
      - name: Build native SEA
        working-directory: upstream
        run: pnpm --filter @zcode/cli sea --target ${{ matrix.target }}
      - name: Smoke test without login
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          export ZCODE_STORAGE_DIR="$HOME/.zcode"
          upstream/apps/zcode-cli/packages/cli/dist/zcode-${{ matrix.target }} --version
          upstream/apps/zcode-cli/packages/cli/dist/zcode-${{ matrix.target }} --help
      - name: Package executable and licenses
        shell: bash
        run: |
          python3 scripts/package.py --target '${{ matrix.target }}' --source 'upstream/apps/zcode-cli/packages/cli/dist/zcode-${{ matrix.target }}' --output release
          cp upstream.json release/upstream-${{ matrix.target }}.json
          cp upstream/LICENSE release/LICENSE-${{ matrix.target }}
          cp upstream/NOTICE.md release/NOTICE-${{ matrix.target }}.md
          cp upstream/THIRD-PARTY-NOTICES.md release/THIRD-PARTY-NOTICES-${{ matrix.target }}.md
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zcode-*
          merge-multiple: true
          path: release
      - name: Upload completed builds as a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --draft --title "ZCode $TAG" --notes "Source-built ZCode CLI. See the repository README for upstream provenance and platform limits."
