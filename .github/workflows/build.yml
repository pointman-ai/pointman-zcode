name: Build ZCode SEA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: The tag's release, for the builds to attach to
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release may already exist (published at the merge): the builds attach to it.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "ZCode $TAG" --notes "Source-built ZCode CLI. See the repository README for upstream provenance and platform limits."
  build:
    # after the release job on a tag; a manual run (no tag, so no release) builds and checks only
    needs: release
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: blacksmith-6vcpu-macos-15
          - target: linux-x64
            runner: blacksmith-4vcpu-ubuntu-2404
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Require reviewed immutable upstream pin
        id: pin
        shell: bash
        run: |
          commit="$(python3 scripts/source-pin.py)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install locked workspace dependencies
        working-directory: upstream
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Check fake-key provider settings against pinned upstream
        run: python3 scripts/check-provider.py --upstream upstream
      # These are the first two commands from @zcode/cli's build:sea script.
      # Build every CLI workspace package: SEA also embeds official plugins/TUI.
      # The SEA runtime collection requires dist/index.js from the repository-root
      # packages the CLI uses, which turbo's --cwd apps/zcode-cli never builds.
      # @zcode/shared has no build script: its dist/ only comes from tsc -b.
      - name: Build workspace dependencies and CLI
        working-directory: upstream
        run: |
          pnpm exec tsc -b packages/shared
          pnpm --filter @zcode/model-option-map --filter @zcode/provider --filter @zcode/provider-node build
          pnpm exec turbo --skip-infer --cwd apps/zcode-cli run build --filter=!@zcode/cli --force
          pnpm --filter @zcode/cli build
      - name: Build native SEA
        working-directory: upstream
        run: pnpm --filter @zcode/cli sea --target ${{ matrix.target }}
      - name: Smoke test without login
        shell: bash
        run: |
          export HOME="$(mktemp -d)"
          export ZCODE_STORAGE_DIR="$HOME/.zcode"
          upstream/apps/zcode-cli/packages/cli/dist/zcode-${{ matrix.target }} --version
          upstream/apps/zcode-cli/packages/cli/dist/zcode-${{ matrix.target }} --help
      - name: Package executable and licenses
        shell: bash
        run: |
          python3 scripts/package.py --target '${{ matrix.target }}' --source 'upstream/apps/zcode-cli/packages/cli/dist/zcode-${{ matrix.target }}' --output release --upstream upstream
          cp upstream.json release/upstream-${{ matrix.target }}.json
          cp upstream/LICENSE release/LICENSE-${{ matrix.target }}
          cp upstream/NOTICE.md release/NOTICE-${{ matrix.target }}.md
          cp upstream/THIRD-PARTY-NOTICES.md release/THIRD-PARTY-NOTICES-${{ matrix.target }}.md
      - name: Attach this build to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          command -v gh >/dev/null || brew install gh
          gh release upload "${{ github.ref_name }}" release/* --clobber
